# Render Blueprint — faqat backend uchun (frontend Vercel'da)
services:
  - type: web
    name: halila-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: LEADS_FILE
        value: /var/data/leads.json
    disk:
      name: halila-data
      mountPath: /var/data
      sizeGB: 1
